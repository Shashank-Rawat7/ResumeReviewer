# ResumeReviewer: PostgreSQL 15 + FastAPI backend + Streamlit frontend.
#   docker compose up --build        start everything (needs a .env, see .env.example)
#   docker compose down              stop (data is kept in the named volumes)
#   docker compose down -v           stop and DELETE the database and uploaded files
#
# Only the variables the application needs are passed into the containers (not the whole .env file).
# Host ports are bound to 127.0.0.1 and can be changed (e.g. to run two stacks) with
# POSTGRES_HOST_PORT / BACKEND_HOST_PORT / FRONTEND_HOST_PORT.

services:
  postgres:
    image: postgres:15.20-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - resume-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?set YOUTUBE_API_KEY in .env}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - resume-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - resume-network

networks:
  resume-network:
    driver: bridge

volumes:
  postgres_data:
  uploads:
