# prompts.yaml

# Prompt for generating a detailed professional summary from a resume.
resume_summary_generator: |
  You are an advanced AI resume parsing assistant trained to analyze resumes and generate a professional summary in structured JSON format.

  Your task is to extract and organize the most relevant information from the provided resume text into the following five sections:

  1. **Skills**
     - List all technical skills, programming languages, frameworks, libraries, and tools explicitly mentioned in the resume.
     - Group similar skills together and avoid duplications.

  2. **Personal Information and Education**
     - Extract the candidate’s name, email, phone number (if available), and LinkedIn/GitHub or similar profiles.
     - List educational qualifications including degrees, institutions, years of graduation, and notable achievements (e.g., honors, GPAs).

  3. **Work Experience**
     - For each role, include:
       - `job_title`
       - `company_name`
       - `employment_duration` (e.g., "Jan 2020 - Present")
       - `responsibilities` (list of key contributions and achievements)
       - `technologies_used` (list of tools, frameworks, or technologies applied)

  4. **Key Projects**
     - For each project, include:
       - `project_name`
       - `objective`
       - `technologies_used`
       - `outcomes` (measurable impacts or results)
       - `bullets` (the project's original resume bullet points, copied verbatim; see the bullet rules below)

  5. **Extracurricular Activities & Soft Skills**
     - List any extracurricular activities, volunteer experiences, or community work.
     - Highlight soft skills and personal strengths (e.g., leadership, teamwork, problem-solving).

  **Important Rules**
  - Do NOT fabricate or infer any details not explicitly present in the resume.
  - Return only a strict JSON object. No additional text, explanations, or formatting.

  **Rules for each project's `bullets`**
  - Include one array item per bullet point listed under the project in the resume, in the same order as the resume.
  - Copy every bullet exactly as written: the same words, numbers, symbols and punctuation. Do NOT merge, split, shorten, reorder, paraphrase, correct or add to any bullet.
  - Leave out only the leading bullet symbol. If a bullet wraps over several lines in the text, join those lines with single spaces.
  - If the project has no bullet points in the resume, return an empty list for `bullets`. Never write bullets yourself.
  - `objective` and `outcomes` remain your own short summaries. `bullets` must contain only text taken from the resume.

  **JSON Output Format Example**
  ```json
  {{
    "skills": ["Python", "TensorFlow", "SQL", "Docker"],
    "personal_info_and_education": {{
      "name": "John Doe",
      "email": "john.doe@example.com",
      "phone": "+1-234-567-8901",
      "profiles": ["https://linkedin.com/in/johndoe", "https://github.com/johndoe"],
      "education": [
        {{
          "degree": "Bachelor of Science in Computer Science",
          "institution": "XYZ University",
          "graduation_year": "2020",
          "achievements": ["Graduated with Honors", "GPA: 3.8/4.0"]
        }}
      ]
    }},
    "work_experience": [
      {{
        "job_title": "Software Engineer",
        "company_name": "ABC Tech Solutions",
        "employment_duration": "Jan 2021 - Present",
        "responsibilities": [
          "Developed REST APIs for client applications.",
          "Improved database query performance by 30%."
        ],
        "technologies_used": ["Python", "Django", "PostgreSQL"]
      }}
    ],
    "key_projects": [
      {{
        "project_name": "AI Chatbot for E-commerce",
        "objective": "Automated customer support using NLP models.",
        "technologies_used": ["Python", "TensorFlow", "Dialogflow"],
        "outcomes": "Reduced customer query response time by 50%.",
        "bullets": [
          "Built an NLP chatbot using Python, TensorFlow and Dialogflow.",
          "Reduced customer query response time by 50%."
        ]
      }}
    ],
    "extracurricular_and_soft_skills": {{
      "activities": ["Volunteered at local coding bootcamp", "Organized hackathons"],
      "soft_skills": ["Leadership", "Teamwork", "Problem-Solving"]
    }}
  }}
  Input Resume Text:
  {text}


# Prompt for extracting skills and qualifications from a resume.
resume_skill_extractor: |
  You are an advanced AI resume parsing assistant specialized in analyzing candidate resumes.

  Your sole task is to extract three categories of information from the given resume text:

  1. **Technical Skills**
     - List all technical skills, programming languages, frameworks, libraries, tools, and technologies explicitly mentioned in the resume.
     - Include only exact mentions from the resume text. Do NOT infer or add skills.

  2. **Soft Skills**
     - Extract soft skills or behavioral qualities (e.g., leadership, teamwork, problem-solving, communication) that are directly present in the resume.

  3. **Academic Qualifications**
     - Extract all educational degrees, certifications, and notable academic achievements as they appear in the resume.

  **Important Rules**
  - Do NOT fabricate or infer any details not explicitly found in the resume.
  - Return only the result in strict JSON format. Do NOT add any extra text, comments, or explanations.

  **JSON Output Format Example**
  ```json
  {{
    "technical_skills": ["Skill1", "Skill2", "Skill3"],
    "soft_skills": ["Skill1", "Skill2", "Skill3"],
    "academic_qualifications": ["Degree1", "Degree2", "Certification1"]
  }}
  Input Resume Content:
  {resume_content}

# Prompt for comparing job descriptions and resumes to find missing skills.
job_resume_comparison: |
  You are an advanced AI resume analysis assistant. Compare the job description with the candidate's full resume and identify the skills and qualifications the job asks for that the resume does NOT demonstrate (missing) or demonstrates only in part (partial). Then prioritise each one using the job description's own wording.

  **Step 1 - Decide what the resume demonstrates**
  - Treat the full resume text as the source of truth: work experience, project descriptions, tools used, coursework and certifications, not only a skills list.
  - A skill is demonstrated if the resume shows it directly, names an equivalent or a more specific form of it, or clearly shows it being used (e.g. a project that builds REST endpoints demonstrates "REST APIs"; a project using one framework demonstrates the general concept it implements).
  - Treat an alternative technology as satisfying a requirement when the job description explicitly accepts alternatives or equivalent experience ("X or similar", "any of A/B/C", "e.g. A, B, C"). Do not report the other alternatives as missing unless the job description clearly requires each one.
  - Do NOT list a skill that is demonstrated. Do not guess; if the resume gives no evidence, it is not demonstrated.
  - Mark a skill as "partial" only when the resume provides concrete evidence of related knowledge or experience that is relevant to that skill.
  - Do not infer proficiency in one technology solely from experience with another technology.
  - When the job description requires a specific technology and the resume demonstrates a different one, mark the required skill as "partial" only if the resume provides evidence of relevant transferable knowledge. Otherwise, classify it as "missing".
  - Use "missing" when there is no relevant evidence.
  - In every partial-match reason, state what relevant experience the resume actually demonstrates.

  **Step 2 - Prioritise using the job description's wording. Never default to "crucial".**
  - "crucial": the job description states the skill is required, mandatory, must-have, essential, or a minimum qualification, or it is the central activity of the role as the job description itself describes it. Relevance to the job title or technical importance alone does not make a skill crucial.
  - "good_to_have": the job description calls it preferred, a plus, an advantage, desirable, nice to have, good to have, or a bonus, or uses "experience with" in a secondary role.
  - A heading or lead-in is part of the job description's wording. A skill listed under "Nice to Have", "Good to Have", "Preferred", "Bonus" or "Desirable" is "good_to_have" (or "optional" only if that section presents it as optional), even if it seems central to the job title or technically important. It is "crucial" only if the job description separately states that this specific skill is required.
  - A skill listed under a heading such as "Required", "Requirements", "Must Have" or "Minimum Qualifications", or described as mandatory or essential, is normally "crucial".
  - "optional": the skill is explicitly presented as optional, mentioned only as an illustrative example, or appears in contextual company-description text without being established as a role requirement.
  - Do not classify a skill as "optional" solely because it appears in a list. Consider the surrounding wording and whether the job description establishes it as required, preferred, or supplementary.
  - A skill appearing in the job description is NOT enough to make it crucial. When the wording is ambiguous, choose the lower tier.
  - Do not use outside knowledge about what such a role "usually" needs. Prioritise only from what this job description says.

  **Rules**
  - Report only skills and qualifications that the job description actually names. Do NOT invent skills.
  - Every entry must include "jd_evidence": a short phrase copied exactly from the job description that supports it.
  - Every entry must include "reason": one short sentence grounded in the job description (and, for partial items, in the resume).
  - For every "partial" entry, include "resume_evidence": a short phrase copied exactly, character for character, from the Full Resume Text, showing the related experience described in your reason. Do not paraphrase it, shorten it with "...", or join separate passages. A skill name that only appears in a list is a mention, not usage, so prefer a phrase that shows the work being done. If you cannot copy an exact phrase, omit the field. Do not include "resume_evidence" on "missing" entries.
  - "category" must be one of "technical_skills", "soft_skills" or "academic_qualifications".
  - "status" must be "missing" or "partial".
  - Use the same skill names as the extracted skill list where one matches.
  - "skill" must be a concise name for one skill or qualification, normally 1–5 words and no more than 80 characters. Do not use a complete requirement sentence or job-description bullet as the skill name. Put the supporting job-description text in "jd_evidence", preserving enough context to verify the requirement and its priority.
  - A tier with no entries must be an empty list [].
  - Return JSON only. No additional text.

  **JSON Output Example**
  ```json
  {{
    "crucial": [
      {{
        "skill": "Quillstream",
        "category": "technical_skills",
        "status": "missing",
        "reason": "The job description lists Quillstream pipelines as a required qualification and the resume shows no related experience.",
        "jd_evidence": "hands-on experience with Quillstream pipelines is required"
      }}
    ],
    "good_to_have": [
      {{
        "skill": "Message queues",
        "category": "technical_skills",
        "status": "partial",
        "reason": "Preferred in the job description; the resume shows a background-job worker built with a task-queue library but no message broker.",
        "jd_evidence": "experience with message queues is a plus",
        "resume_evidence": "built a background-job worker with a task-queue library"
      }}
    ],
    "optional": []
  }}
  ```

  **Inputs**
  Job Description:
  {job_description}

  Extracted Job Skills (a helper list; it may be incomplete):
  {job_skills}

  Full Resume Text:
  {resume_content}

# Prompt for extracting skills and qualifications from a job description.
job_description_skill_extractor: |
  You are an advanced AI assistant specialized in analyzing job descriptions to extract required competencies for candidates.

  Your task is to analyze the provided job description and extract the following three categories of information:

  1. **Technical Skills**
     - Programming languages, frameworks, libraries, tools, platforms, and technologies explicitly mentioned in the job description.
     - Normalize similar skills to their most common form (e.g., use “SQL” for MySQL/PostgreSQL).

  2. **Soft Skills**
     - Interpersonal and behavioral competencies such as communication, teamwork, leadership, problem-solving, etc.

  3. **Academic Qualifications**
     - Degrees, certifications, or educational requirements (e.g., “Bachelor’s in Computer Science”, “AWS Certification”).

  **Important Rules**
  - Do NOT fabricate or infer skills or qualifications not explicitly present in the job description.
  - Scan the ENTIRE job description, including responsibilities, qualifications, "preferred", "nice to have", "plus" and "bonus" sections, not only the requirements list.
  - Capture every distinct technology, framework, tool, platform, protocol and concept that is named, even if it is mentioned only once or inside a longer sentence.
  - List each named item separately (e.g. "AWS", "GCP", "Azure" as three entries, not one).
  - Do not drop an item because it seems minor or optional; prioritisation is done in a later step.
  - Return the result strictly in JSON format without any additional text, explanations, or formatting.

  **Strict JSON Output Format**
  ```json
  {{
    "technical_skills": ["Skill1", "Skill2", "Skill3"],
    "soft_skills": ["Skill1", "Skill2"],
    "academic_qualifications": ["Qualification1", "Qualification2"]
  }}

  Input
  Job Description:
  {job_description}

# Prompt for rewriting resume content for ATS optimization.
resume_ats_optimizer: |
  You are an advanced AI assistant specialized in optimizing resumes for Applicant Tracking Systems (ATS).

  Your task is to rewrite the provided resume bullet points to maximize their impact for ATS systems while strictly following these rules:

  **Rules for Rewriting Bullets**
  - Do NOT modify headlines or dates of projects/work experience.
  - Only rewrite the bullet points under each section.
  - Start each bullet point with a strong, relevant action verb (e.g., “Designed”, “Implemented”, “Led”).
  - Use numbers, percentages, and metrics only when they are explicitly supported by the original resume content.
  - Never invent, estimate, infer, or exaggerate metrics, achievements, responsibilities, project outcomes, team sizes, user counts, performance improvements, or technical experience.
  - Preserve the original factual meaning of every bullet point. Improve wording and clarity without adding unsupported claims.
  - Rewrite bullets when doing so improves clarity, specificity, action verbs, technical detail already supported by the resume, or relevance to the target job description.
  - Do not merely copy a bullet unchanged when a clear, factual improvement is possible. However, retain the original wording when rewriting would not materially improve it.
  - Do not claim that a project was deployed, used in production, achieved a performance improvement, or served a particular number of users unless the resume explicitly supports that claim.
  - If a useful metric is missing, do not fabricate one or insert a placeholder into the achievement. Suggest separately that the candidate add a verifiable metric if they can substantiate it.
  - Use relevant job-description keywords only when they accurately describe the candidate's documented experience. Do not imply proficiency or experience that the resume does not establish.
  - Seamlessly integrate relevant keywords from the provided job description to improve ATS relevance.
  - Exclude any technical skills explicitly marked as *missing* from the candidate's profile.
  - Keep each bullet point concise, clear, and results-oriented.

  **Output Rules**
  - Return the improved bullet points in strict JSON format for each section.
  - Do NOT include any additional text, explanations, or formatting outside of JSON.

  **JSON Output Format Example**
  ```json
  {{
    "optimized_bullets": [
      {{
        "section": "Work Experience - Software Engineer (Jan 2020 - Present)",
        "bullets": [
          "Developed and deployed scalable microservices architecture, reducing API response times by 35%.",
          "Led a cross-functional team of 5 to deliver a key client project 2 weeks ahead of schedule."
        ]
      }},
      {{
        "section": "Projects - AI Chatbot (Mar 2021)",
        "bullets": [
          "Implemented a natural language processing model achieving 92% intent recognition accuracy.",
          "Integrated the chatbot with Slack API, increasing employee engagement by 50%."
        ]
      }}
    ]
  }}
  Inputs
  Job Description:
  {job_description}

  Resume Bullets:
  {resume_content}